# Virtual host for the SPA, loaded by IPAx in proxy mode from /var/ipax/proxy_conf.d/
server {
	listen 80;
	server_name spa;

	set $template_root /var/ipax/templates;

	include /var/ipax/conf/location_norobots.conf;

	# SPA static files, served by IPAx. Requires an authenticated user.
	# OIDC redirect_uri (/private/redirect_uri) and logout (/private/logout) are handled by lua-resty-openidc.
	location / {
		access_by_lua_block {
			local ipax = require("ipax")
			ngx.ctx.res = ipax.get_res(ipax.get_oidc_opts(), ipax.get_session_opts())
		}
		root /var/ipax/html;
		# Fall back to index.html so client-side routes work
		try_files $uri $uri/ /index.html;
	}

	# Error and logout pages from IPAx, reachable without a session
	location ~ ^/(loginError|loginRequired|authenticationError|logoutSuccess)\.html$ {
		root /var/ipax/html;
	}

	# Claims of the logged in user, used by the SPA to show the username
	location = /userinfo {
		default_type application/json;
		add_header Cache-Control no-store;
		access_by_lua_block {
			local ipax = require("ipax")
			ngx.ctx.res = ipax.get_res(ipax.get_oidc_opts(), ipax.get_session_opts())
		}
		content_by_lua_block {
			ngx.say(require("ipax").get_userinfo_json(ngx.ctx.res))
		}
	}

	# IPAx info page: ID token, access token, userinfo and HTTP headers
	location /private {
		add_header Cache-Control no-store;
		add_header Pragma no-cache;
		default_type text/html;
		access_by_lua_block {
			local ipax = require("ipax")
			local oidc_opts = ipax.get_oidc_opts()
			local session_opts = ipax.get_session_opts()
			ngx.ctx.res = ipax.get_res(oidc_opts, session_opts)
			ngx.ctx.data = ipax.get_info_data(oidc_opts, session_opts, ipax.get_var_or_env("ipax_display_name"), ipax.get_var_or_env("ipax_app_name"), ipax.get_var_or_env("ipax_base_url"), ngx.req.get_headers())
		}
		content_by_lua_block {
			require("resty.template").render_file("info.html", ngx.ctx.data)
		}
	}

	# API calls from the SPA, forwarded with the user's access token as Bearer
	location /api/ {
		set $api_base_url '';
		access_by_lua_block {
			local ipax = require("ipax")
			local session_opts = ipax.get_session_opts()
			ngx.ctx.res = ipax.get_res(ipax.get_oidc_opts(), session_opts)
			-- API_BASE_URL has no path (e.g. http://api:8080), so the request URI is forwarded as is
			ngx.var.api_base_url = os.getenv("API_BASE_URL")
			ngx.req.set_header("Authorization", "Bearer " .. ipax.get_access_token(ngx.ctx.res))
			-- don't send the (large) IPAx session cookies to the API, prevents HTTP error 431
			ipax.filter_session_cookies(session_opts)
		}
		proxy_pass $api_base_url;
	}
}
