version: 2

updates:
  # SPA dependencies (spa/package.json)
  - package-ecosystem: npm
    directory: /spa
    schedule:
      interval: weekly
    groups:
      # one PR for all minor and patch updates; majors get their own PR
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # Base images in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # stay on the current Node.js LTS line, move to the next LTS manually
      - dependency-name: node
        update-types:
          - version-update:semver-major

  # Images in compose.yaml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
